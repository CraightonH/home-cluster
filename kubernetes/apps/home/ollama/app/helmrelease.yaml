---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: home
spec:
  interval: 30m
  chart:
    spec:
      chart: ollama
      version: 1.40.0
      sourceRef:
        kind: HelmRepository
        name: otwld
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 15m
  values:
    ollama:
      models:
        pull:
          - llama3.1:8b

    ingress:
      enabled: true

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64

    persistentVolume:
      size: 30Gi