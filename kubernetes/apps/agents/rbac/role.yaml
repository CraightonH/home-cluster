---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clawdbot-prototype-web-app-role
  namespace: agents
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
