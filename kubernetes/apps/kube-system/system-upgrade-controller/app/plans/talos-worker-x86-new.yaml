---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
# Upgrades new x86 worker nodes (node6, node7, node8 — schematic 3a33ec6d).
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-worker-x86-new
  namespace: system-upgrade
spec:
  version: v1.12.9
  serviceAccountName: system-upgrade
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      - key: talos.dev/schematic-group
        operator: In
        values:
          - x86-new
  secrets:
    - name: talos-upgrade-config
      path: /etc/talos
  upgrade:
    image: ghcr.io/siderolabs/talosctl:v1.12.9
    command:
      - /talosctl
    env:
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    args:
      - upgrade
      - --nodes
      - $(NODE_IP)
      - --endpoints
      - $(NODE_IP)
      - --talosconfig
      - /etc/talos/talosconfig
      - --image
      - factory.talos.dev/installer/3a33ec6dfc8cfd61d2a3db3caf97894f31e913952d71ce3c3fbbe565a3f08339:v1.12.9
      - --wait=false
