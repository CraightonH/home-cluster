---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: enshrouded
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: enshrouded-dedicated-server
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: jsknnr
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 20m  # Allow time for initial setup
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 20m
  values:
    # Container image
    image:
      repository: sknnr/enshrouded-dedicated-server
      tag: latest
      pullPolicy: Always
    
    # Service configuration - use NodePort for home cluster
    service:
      type: NodePort
      externalIPs: []
      annotations: {}
      ports:
        game:
          port: 15637
          nodePort: 30637
          protocol: UDP
        steam:
          port: 27015
          nodePort: 30027
          protocol: UDP
    
    # Resource allocation
    resources:
      requests:
        memory: 12G
        cpu: 4.0
      limits:
        memory: 16G
        cpu: 6.0
    
    # Persistent storage
    volumes:
      dataPVC:
        size: 50Gi
      storageClassName: "nfs-client"
    
    # Server configuration
    config:
      serverName: "Hancock Enshrouded"
      serverPasswordExistingSecretName: "enshrouded-secret"
      port: 15637
      steamPort: 27015
      serverSlots: 16
      externalConfig: 0
