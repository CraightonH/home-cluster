---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: palworld
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 20m  # Allow time for initial SteamCMD download
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 20m
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - node1 # Palworld can use up to ~16GB RAM

    global:
      fullnameOverride: palworld

    controllers:
      palworld:
        type: statefulset
        replicas: 1
        containers:
          palworld:
            image:
              # Matches the korax-dev reference chart's image
              repository: jammsen/palworld-dedicated-server
              tag: latest
              pullPolicy: Always
            # Secrets (SERVER_PASSWORD, ADMIN_PASSWORD) come from the
            # SOPS-encrypted palworld-secret - never inlined in values
            envFrom:
              - secretRef:
                  name: palworld-secret
            env:
              TZ: America/Denver
              # jammsen image errors on PUID/PGID 0 - must run as non-root
              PUID: "1000"
              PGID: "1000"
              # Required: without this the entrypoint falls back to "manual"
              # and ignores every env var (incl. name/passwords from the secret)
              SERVER_SETTINGS_MODE: "auto"
              SERVER_DESCRIPTION: ""
              MAX_PLAYERS: "16"
              PUBLIC_PORT: "8211"
              MULTITHREAD_ENABLED: "true"
              COMMUNITY_SERVER: "false"
              ALWAYS_UPDATE_ON_START: "true"
              RCON_ENABLED: "false"
              RESTAPI_ENABLED: "true"
              # Rolling backups managed by the container
              BACKUP_ENABLED: "true"
              BACKUP_CRON_EXPRESSION: "0 * * * *"
              BACKUP_RETENTION_POLICY: "true"
              BACKUP_RETENTION_AMOUNT_TO_KEEP: "168"
              # ----------------------------------------------------------------
              # Optional game settings (only applied in SERVER_SETTINGS_MODE=auto).
              # Uncomment and tweak as needed; values shown are the defaults.
              # Full reference: https://github.com/jammsen/docker-palworld-dedicated-server/blob/master/docs/ENV_VARS.md
              # --- Server / access ---
              # SERVER_NAME: "..."          # set via palworld-secret
              # SERVER_PASSWORD: "..."      # set via palworld-secret
              # ADMIN_PASSWORD: "..."       # set via palworld-secret
              # ALLOW_CLIENT_MOD: "true"
              # CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"
              # USEAUTH: "true"
              # REGION: ""
              # PUBLIC_IP: ""
              # BAN_LIST_URL: "https://b.palworldgame.com/api/banlist.txt"
              # NETSERVERMAXTICKRATE: "120"
              # SHOW_PLAYER_LIST: "false"
              # CHAT_POST_LIMIT_PER_MINUTE: "30"
              # ENABLE_VOICE_CHAT: "false"          # new in 1.0
              # --- Rates / progression ---
              # EXP_RATE: "1.000000"
              # PAL_CAPTURE_RATE: "1.000000"
              # PAL_SPAWN_NUM_RATE: "1.000000"
              # COLLECTION_DROP_RATE: "1.000000"
              # COLLECTION_OBJECT_HP_RATE: "1.000000"
              # COLLECTION_OBJECT_RESPAWN_SPEED_RATE: "1.000000"
              # ENEMY_DROP_ITEM_RATE: "1.000000"
              # WORK_SPEED_RATE: "1.000000"
              # PAL_EGG_DEFAULT_HATCHING_TIME: "1.000000"
              # DAYTIME_SPEEDRATE: "1.000000"
              # NIGHTTIME_SPEEDRATE: "1.000000"
              # --- Combat / damage ---
              # DIFFICULTY: "None"
              # PLAYER_DAMAGE_RATE_ATTACK: "1.000000"
              # PLAYER_DAMAGE_RATE_DEFENSE: "1.000000"
              # PAL_DAMAGE_RATE_ATTACK: "1.000000"
              # PAL_DAMAGE_RATE_DEFENSE: "1.000000"
              # DEATH_PENALTY: "Item"           # None | Item | ItemAndEquipment | All
              # ENABLE_PLAYER_TO_PLAYER_DAMAGE: "false"
              # ENABLE_FRIENDLY_FIRE: "false"
              # IS_PVP: "false"
              # HARDCORE: "false"
              # PAL_LOST: "false"
              # CHARACTER_RECREATE_IN_HARDCORE: "false"
              # ENABLE_INVADER_ENEMY: "true"
              # ENABLE_PREDATOR_BOSS_PAL: "true"
              # --- Survival multipliers ---
              # PLAYER_STOMACH_DECREASE_RATE: "1.000000"
              # PLAYER_STAMINA_DECREACE_RATE: "1.000000"
              # PLAYER_AUTO_HP_REGENE_RATE: "1.000000"
              # PLAYER_AUTO_HP_REGENE_RATE_IN_SLEEP: "1.000000"
              # PAL_STOMACH_DECREACE_RATE: "1.000000"
              # PAL_STAMINA_DECREACE_RATE: "1.000000"
              # PAL_AUTO_HP_REGENE_RATE: "1.000000"
              # PAL_AUTO_HP_REGENE_RATE_IN_SLEEP: "1.000000"
              # ITEM_WEIGHT_RATE: "1.000000"
              # --- Building / objects ---
              # BUILD_OBJECT_HP_RATE: "1.000000"
              # BUILD_OBJECT_DAMAGE_RATE: "1.000000"
              # BUILD_OBJECT_DETERIORATION_DAMAGE_RATE: "1.000000"
              # BUILD_AREA_LIMIT: "false"
              # MAX_BUILDING_LIMIT_NUM: "0"
              # DROP_ITEM_MAX_NUM: "3000"
              # DROP_ITEM_ALIVE_MAX_HOURS: "1.000000"
              # --- Guild / base camp ---
              # GUILD_PLAYER_MAX_NUM: "20"
              # BASE_CAMP_MAX_NUM: "128"
              # BASE_CAMP_WORKER_MAXNUM: "15"
              # BASE_CAMP_MAX_NUM_IN_GUILD: "4"
              # COOP_PLAYER_MAX_NUM: "4"
              # AUTO_RESET_GUILD_NO_ONLINE_PLAYERS: "false"
              # AUTO_RESET_GUILD_TIME_NO_ONLINE_PLAYERS: "72.000000"
              # GUILD_REJOIN_COOLDOWN_MINUTES: "0"
              # --- World / misc ---
              # AUTO_SAVE_SPAN: "30.000000"
              # ENABLE_FAST_TRAVEL: "true"
              # ENABLE_FAST_TRAVEL_ONLY_BASE_CAMP: "false"
              # IS_START_LOCATION_SELECT_BY_MAP: "false"
              # EXIST_PLAYER_AFTER_LOGOUT: "false"
              # ENABLE_NON_LOGIN_PENALTY: "true"
              # SUPPLY_DROP_SPAN: "180"
              # ENABLE_WORLD_BACKUP: "true"
            resources:
              requests:
                memory: 8Gi
                cpu: 1000m
              limits:
                memory: 16Gi

    service:
      palworld:
        controller: palworld
        type: NodePort
        ports:
          game:
            port: 8211
            nodePort: 30211
            protocol: UDP

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 50Gi
        retain: true
        advancedMounts:
          palworld:
            palworld:
              - path: /palworld

    serviceAccount:
      create: false
