---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi"

    storageClasses:
      - name: synology-iscsi
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
        mountOptions: []
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:

    driver:
      config:
        driver: synology-iscsi
        instance_id:
        
        httpConnection:
          protocol: https
          host: "${SYNOLOGY_HOST}"
          port: 5001
          username: "${SYNOLOGY_USERNAME}"
          password: "${SYNOLOGY_PASSWORD}"
          allowInsecure: true
          
        synology:
          volume: /volume12

        iscsi:
          targetPortal: "${SYNOLOGY_HOST}:3260"
          targetPortals: []
          interface: ""
          baseiqn: "iqn.2000-01.com.synology:k8s."
          namePrefix: csi-
          nameSuffix: ""

          lunTemplate:
            type: BLUN

          lunSnapshotTemplate:
            is_locked: true

          targetTemplate:
            auth_type: 0
            max_sessions: 0
          
    # Controller deployment
    controller:
      driver:
        image:
          repository: docker.io/democraticcsi/democratic-csi
          tag: v1.9.5
          pullPolicy: IfNotPresent
      
    # Node daemonset
    node:
      driver:
        image:
          repository: docker.io/democraticcsi/democratic-csi
          tag: v1.9.5
          pullPolicy: IfNotPresent
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        iscsiDirHostPath: /usr/local/etc/iscsi
        iscsiDirHostPathType: ""

      hostPID: true
      
      # Talos Linux requires privileged mode for iSCSI
      driverRegistrar:
        enabled: true
        
      # Enable iSCSI client on Talos nodes
      cleanup:
        image: docker.io/busybox:1.36.1
        imagePullPolicy: IfNotPresent
