---
apiVersion: v1
kind: Endpoints
metadata:
  name: nas
  namespace: network
subsets:
  - addresses:
      - ip: "${SECRET_NAS_ADDRESS}"
    ports:
      - name: https
        port: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: nas
  namespace: network
spec:
  ports:
    - name: https
      port: 5001
      targetPort: 5001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nas
  namespace: network
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/upstream-vhost: "${SECRET_NAS_ADDRESS}"
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: internal
  tls:
    - hosts:
        - "nas.${SECRET_DOMAIN}"
      secretName: "nas-tls"
  rules:
    - host: nas.${SECRET_DOMAIN}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: nas
              port:
                number: 5001
