---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synology-csi
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: synology-csi
      version: 0.9.3
      sourceRef:
        kind: HelmRepository
        name: synology-csi
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    storageClasses:
      iscsi:
        - name: synology-iscsi
          host: "${SYNOLOGY_HOST}"
          port: 5000
          protocol: http
          username: "${SYNOLOGY_USERNAME}"
          password: "${SYNOLOGY_PASSWORD}"
          location: "/volume1"
          sessionAffinity: true
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          allowVolumeExpansion: true
    volumeSnapshotClasses:
      - name: synology-snapshot
        isDefault: false
        reclaimPolicy: Delete
