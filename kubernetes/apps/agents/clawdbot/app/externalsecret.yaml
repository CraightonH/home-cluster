---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clawdbot-secret
  namespace: agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-home-main
  target:
    name: clawdbot-secret
    creationPolicy: Owner
  # Pull ALL secrets from Doppler home/main config
  dataFrom:
    - find:
        name:
          regexp: ".*"
