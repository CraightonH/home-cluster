---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: k8s-gateway
    image:
      registry: codeberg.org
      repository: k8s-gateway/k8s_gateway
      tag: "1.8.4@sha256:5fc84f1e29644779971692419c5c4f80453ee43b6d523eff3e0b1ed1cd194793"
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        io.cilium/lb-ipam-ips: "192.168.1.153"
      externalTrafficPolicy: Cluster
    watchedResources: ["Ingress", "Service"]
