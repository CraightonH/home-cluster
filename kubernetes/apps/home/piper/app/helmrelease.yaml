---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
  namespace: home
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 15m
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: rhasspy/wyoming-piper
              tag: 2.5.2
            env:
              TZ: America/Denver
            command:
              - bash
              - docker_run.sh
              - "--voice" 
              - en_US-amy-medium
              # - python3
              # - '-m'
              # - wyoming_faster_whisper
              # - '--uri'
              # - tcp://0.0.0.0:10300
              # - '--data-dir'
              # - /data
              # - '--download-dir'
              # - /data
              # - '--model'
              # - tiny-int8
              # - '--language'
              # - en
            # probes: # TODO: investigate healthchecks
            #   liveness: &haprobes
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /manifest.json
            #         port: &haport 8123
            #       initialDelaySeconds: 15
            #       periodSeconds: 10
            #       timeoutSeconds: 5
            #       failureThreshold: 3
            #   readiness: *haprobes

    service:
      main:
        controller: main
        ports:
          tcp:
            port: 10200
          http:
            port: 5000

    persistence:
      data:
        type: nfs
        server: ${SECRET_NAS_ADDRESS}
        path: /volume12/pvc/whisper
        advancedMounts:
          main:
            main:
              - path: /data
                readOnly: false
