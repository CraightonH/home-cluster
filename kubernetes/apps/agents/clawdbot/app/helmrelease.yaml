---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clawdbot
  namespace: agents
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The deployment was hand-scaled to 0 while shut down. Helm's three-way merge
  # leaves an unchanged replicas field alone, so drift detection is what puts it back to 1.
  driftDetection:
    mode: enabled
  values:
    controllers:
      clawdbot:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - amd64
        initContainers:
          seed-home:
            # Same image as the app so jq is available. Runs as root to chown.
            image:
              repository: craighton/clawdbot-k8s
              tag: 2026.9.4-k8s
            securityContext:
              runAsUser: 0
            command:
              - sh
              - -c
              - |
                set -eu
                # First boot only: carry the old config and dotfiles from the NFS home
                # onto the new block-storage home. Marker file makes this idempotent.
                if [ ! -f /home/node/.seeded ]; then
                  mkdir -p /home/node/.openclaw
                  # Strip the Anthropic auth profile, the sonnet model pin and allowlist,
                  # and contextPruning (unconfirmed in the 2026.9 strict schema).
                  jq 'del(.auth, .agents.defaults.model, .agents.defaults.models, .agents.defaults.contextPruning)' \
                    /oldhome/.openclaw/openclaw.json > /home/node/.openclaw/openclaw.json
                  [ -d /oldhome/.openclaw/credentials ] && cp -a /oldhome/.openclaw/credentials /home/node/.openclaw/
                  for d in .talos .doppler .config/sops; do
                    if [ -d "/oldhome/$d" ]; then mkdir -p "/home/node/$(dirname $d)"; cp -a "/oldhome/$d" "/home/node/$d"; fi
                  done
                  [ -f /oldhome/.gitconfig ] && cp -a /oldhome/.gitconfig /home/node/.gitconfig
                  # The workspace checkout on NFS was written as root; the gateway now runs as 1000.
                  chown -R 1000:1000 /oldhome/clawd
                  date -u +%FT%TZ > /home/node/.seeded
                fi
                chown -R 1000:1000 /home/node
        containers:
          clawdbot:
            image:
              repository: craighton/clawdbot-k8s
              tag: 2026.9.4-k8s
            env:
              HOME: /home/node
              TERM: xterm-256color
              TZ: America/Denver
              OPENCLAW_STATE_DIR: /home/node/.openclaw
              OPENCLAW_GATEWAY_PORT: "18789"
            envFrom:
              - secretRef:
                  name: clawdbot-secret
            command:
              - node
              - dist/index.js
              - gateway
              - --bind
              - lan
              - --port
              - "18789"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /startupz
                    port: &port 18789
                  periodSeconds: 10
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /startupz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      clawdbot:
        controller: clawdbot
        ports:
          http:
            port: *port

    ingress:
      clawdbot:
        enabled: true
        className: internal
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - host: clawd.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: clawdbot
                  port: http
        tls:
          - hosts:
              - clawd.${SECRET_DOMAIN}
            secretName: clawd-tls

    persistence:
      # Whole home on block storage: OpenClaw's SQLite state and hard-link locks
      # are not safe on NFS (openclaw/openclaw#81089).
      home:
        enabled: true
        type: persistentVolumeClaim
        storageClass: synology-iscsi
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        advancedMounts:
          clawdbot:
            seed-home:
              - path: /home/node
            clawdbot:
              - path: /home/node
      # Existing NFS volume. Kept intact as rollback; only clawd/ is exposed to
      # the gateway, which hides the stale .openclaw state next to it.
      oldhome:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: clawdbot-workspace
        advancedMounts:
          clawdbot:
            seed-home:
              - path: /oldhome
            clawdbot:
              - path: /home/node/clawd
                subPath: clawd
