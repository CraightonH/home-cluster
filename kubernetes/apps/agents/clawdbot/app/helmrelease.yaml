---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clawdbot
  namespace: agents
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      clawdbot:
        containers:
          clawdbot:
            image:
              repository: craighton/clawdbot-k8s
              tag: latest
            env:
              HOME: /home/node
              TERM: xterm-256color
              TZ: America/Denver
              CLAWDBOT_GATEWAY_BIND: lan
              CLAWDBOT_GATEWAY_PORT: "18789"
              CLAWDBOT_ALLOW_MULTI_GATEWAY: "1"
            envFrom:
              - secretRef:
                  name: clawdbot-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 18789
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            command:
              - node
              - dist/index.js
              - gateway
              - --port
              - "18789"
              - --bind
              - lan

    service:
      clawdbot:
        controller: clawdbot
        ports:
          http:
            port: *port

    ingress:
      clawdbot:
        enabled: true
        className: internal
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - host: clawd.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: clawdbot
                  port: http
        tls:
          - hosts:
              - clawd.${SECRET_DOMAIN}
            secretName: clawd-tls

    persistence:
      # Note: config PVC (clawdbot-config) is no longer needed
      # .clawdbot data has been migrated into the workspace PVC
      # The old PVC can be deleted after confirming stability
      workspace:
        enabled: true
        type: persistentVolumeClaim
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /home/node
