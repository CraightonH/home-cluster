---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: satisfactory
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - node1 # Satisfactory needs significant RAM (6-12GB)

    global:
      fullnameOverride: satisfactory

    controllers:
      satisfactory:
        type: statefulset
        replicas: 1
        containers:
          satisfactory:
            image:
              repository: wolveix/satisfactory-server
              tag: v1.8.7
            envFrom:
              - secretRef:
                  name: satisfactory-secret
            env:
              TZ: America/Denver
              MAXPLAYERS: "4"
              SERVERGAMEPORT: "7777"
              PGID: "1000"
              PUID: "1000"
              AUTOPAUSE: "true"
              AUTOSAVEINTERVAL: "300"
              AUTOSAVENUM: "5"
              AUTOSAVEONDISCONNECT: "true"
              CRASHREPORT: "false"
              DEBUG: "false"
              DISABLESEASONALEVENTS: "false"
              NETWORKQUALITY: "3"
              ROOTLESS: "false"
              SERVERNAME: "GigaFactoryTX"
              SKIPUPDATE: "false"
              STEAMBETA: "false"
            resources:
              requests:
                memory: 6Gi
                cpu: 500m
              limits:
                memory: 12Gi
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - /home/steam/healthcheck.sh
                  initialDelaySeconds: 600
                  periodSeconds: 30
                  failureThreshold: 4
                  successThreshold: 1
              readiness:
                enabled: false
              startup:
                enabled: false

    service:
      satisfactory:
        controller: satisfactory
        type: NodePort
        ports:
          game-udp:
            port: 7777
            nodePort: 30777
            protocol: UDP
          game-tcp:
            port: 7777
            nodePort: 30777
            protocol: TCP
          game-messaging:
            port: 8888
            nodePort: 30888
            protocol: TCP

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: nfs-client
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          satisfactory:
            satisfactory:
              - path: /config

    serviceAccount:
      create: false
