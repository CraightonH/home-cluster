---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: icarus
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # dependsOn:
  #   - name: ingress-nginx-external
  #     namespace: network
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # dnsPolicy: ClusterFirstWithHostNet
      # hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - node5 # biggest node with most RAM. Server can require up to 16GB at times

    global:
      fullnameOverride: icarus

    controllers:
      icarus:
        replicas: 1
        containers:
          icarus:
            image:
              repository: mornedhels/icarus-server
              tag: latest
            env:
              TZ: America/Denver
              SERVER_PORT: &gameport 32777
              SERVER_QUERYPORT: &steamqueryport 32778
              SERVER_PASSWORD: ${SECRET_ICARUS_SERVER_PASSWORD}
              SERVER_ADMIN_PASSWORD: ${SECRET_ICARUS_SERVER_ADMIN_PASSWORD}
              UPDATE_SKIP: true

    service:
      game-service:
        controller: "{{ .Values.global.fullnameOverride }}"
        nameOverride: "{{ .Values.global.fullnameOverride }}-game-service" 
        ports:
          game:
            type: NodePort
            port: *gameport
            protocol: UDP
      steam-query-service:
        controller: "{{ .Values.global.fullnameOverride }}"
        nameOverride: "{{ .Values.global.fullnameOverride }}-steam-query-service" 
        ports:
          query:
            type: NodePort
            port: *steamqueryport
            protocol: UDP

    ingress:
      icarus-game:
        enabled: false # TODO: figure out udp routing with ingress-nginx (https://kubernetes.github.io/ingress-nginx/user-guide/exposing-tcp-udp-services/)
        className: external
        nameOverride: icarus-game-server
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.alpha.kubernetes.io/target: games.${SECRET_DOMAIN}
        hosts:
          - host: games.${SECRET_DOMAIN}
            paths:
              - path: /icarus
                service:
                  identifier: game-service
        tls:
          - hosts:
              - games.${SECRET_DOMAIN}
            secretName: icarus-game-tls
      icarus-query:
        enabled: false # TODO: figure out udp routing with ingress-nginx (https://kubernetes.github.io/ingress-nginx/user-guide/exposing-tcp-udp-services/)
        className: external
        nameOverride: icarus-query
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.alpha.kubernetes.io/target: games.${SECRET_DOMAIN}
        hosts:
          - host: games.${SECRET_DOMAIN}
            paths:
            - path: /icarus
              service:
                identifier: query-service
        tls:
          - hosts:
              - games.${SECRET_DOMAIN}
            secretName: icarus-query-tls

    persistence:
      config:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_ADDRESS}
        path: /volume6/home-assistant-config
        globalMounts:
          - path: /config
      media:
        enabled: true
        type: nfs
        server: ${SECRET_NAS_ADDRESS}
        path: /volume10/nvr
        advancedMounts:
          home-assistant:
            home-assistant:
              - path: /mnt/media/nvr
                readOnly: true

    serviceAccount:
      create: false
