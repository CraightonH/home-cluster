---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
  namespace: home
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  dependsOn:
    - name: ingress-nginx-external
      namespace: network
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 15m
  values:
    global:
      fullnameOverride: whisper

    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64

    controllers:
      whisper:
        replicas: 1
        strategy: Recreate
        containers:
          whisper:
            image:
              repository: homeassistant/amd64-addon-whisper
              tag: 2.4.0
            env:
              TZ: America/Denver
              MODEL: tiny-int8
              LANGUAGE: en
            # probes: # TODO: investigate healthchecks
            #   liveness: &haprobes
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /manifest.json
            #         port: &haport 8123
            #       initialDelaySeconds: 15
            #       periodSeconds: 10
            #       timeoutSeconds: 5
            #       failureThreshold: 3
            #   readiness: *haprobes

    service:
      whisper:
        controller: whisper
        nameOverride: "{{ .Values.global.fullnameOverride }}"
        ports:
          whisper:
            port: 10300


    persistence:
      config:
        type: configMap
        advancedMounts:
          whisper:
            whisper:
              - path: /etc/s6-overlay/s6-rc.d/run
                readOnly: true
                subPath: run
      data:
        type: nfs
        server: ${SECRET_NAS_ADDRESS}
        path: /volume12/pvc/whisper
        advancedMounts:
          whisper:
            whisper:
              - path: /data
                readOnly: false
