---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: factorio
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: game-server
      version: "1.0.3"
      sourceRef:
        kind: HelmRepository
        name: dedicated-game-servers
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Server identity
    name: factorio

    # Factorio Docker image (rootless variant avoids NFS permission issues)
    image:
      repository: factoriotools/factorio
      tag: "stable-rootless"
      pullPolicy: IfNotPresent

    # Resource allocation
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

    # Persistent storage for saves and mods
    persistence:
      enabled: true
      storageClass: "nfs-client"
      size: "50Gi"
      mountPath: "/factorio"

    # Network configuration (NodePort for home cluster access)
    service:
      type: NodePort
      ports:
        - name: game
          port: 34197
          nodePort: 30197
          protocol: UDP
        - name: rcon
          port: 27015
          nodePort: 30015
          protocol: TCP

    # Environment variables
    env:
      - name: UPDATE_MODS_ON_START
        value: "false"
      - name: SAVE_NAME
        value: "save1"
      - name: GENERATE_NEW_SAVE
        value: "false"

    # Factorio server settings (server-settings.json)
    gameConfig:
      enabled: true
      mountPath: "/factorio/config"
      files:
        server-settings.json: |
          {
            "name": "Hancock Factorio",
            "description": "A Factorio server running on Kubernetes",
            "tags": ["game", "tags"],
            "max_players": 10,
            "visibility": {
              "public": false,
              "lan": true
            },
            "username": "",
            "password": "",
            "token": "",
            "game_password": "",
            "require_user_verification": false,
            "max_upload_in_kilobytes_per_second": 0,
            "max_upload_slots": 5,
            "minimum_latency_in_ticks": 0,
            "ignore_player_limit_for_returning_players": false,
            "allow_commands": "admins-only",
            "autosave_interval": 10,
            "autosave_slots": 5,
            "afk_autokick_interval": 0,
            "auto_pause": true,
            "only_admins_can_pause_the_game": true,
            "autosave_only_on_server": true,
            "non_blocking_saving": false,
            "minimum_segment_size": 25,
            "minimum_segment_size_peer_count": 20,
            "maximum_segment_size": 100,
            "maximum_segment_size_peer_count": 10
          }

    # Pod-level security context (no runAsNonRoot to allow init container)
    podSecurityContext:
      fsGroup: 1000

    # Container-level security context  
    containerSecurityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false

    # Init container to fix NFS permissions for rootless image
    # Needed because existing PVC was created with UID 845 ownership
    initContainers:
      - name: fix-permissions
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            echo "Creating Factorio directory structure..."
            mkdir -p /factorio/saves
            mkdir -p /factorio/config
            mkdir -p /factorio/mods
            mkdir -p /factorio/scenarios
            mkdir -p /factorio/script-output
            echo "Fixing permissions on /factorio..."
            chown -R 1000:1000 /factorio
            chmod -R 775 /factorio
            echo "Permissions fixed!"
        volumeMounts:
          - name: data
            mountPath: /factorio
        securityContext:
          runAsUser: 0  # Run as root to fix permissions

    # Optional: Pin to specific node if needed
    nodeSelector: {}
    tolerations: []
