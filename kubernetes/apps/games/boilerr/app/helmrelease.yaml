---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: boilerr
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: boilerr
      version: 0.3.0
      sourceRef:
        kind: HelmRepository
        name: boilerr
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Operator configuration
    replicaCount: 1

    image:
      repository: ghcr.io/craightonh/boilerr
      pullPolicy: IfNotPresent
      # tag defaults to chart appVersion (0.3.0)

    controllerManager:
      logging:
        level: info
        development: false

      metrics:
        enabled: true

    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi

    # GameDefinitions configuration
    gameDefinitions:
      enabled: true
      # Enable all bundled games by default
      include: []
      exclude: []

    # CRD management
    crds:
      install: true
      keep: true

    # RBAC and ServiceAccount
    rbac:
      create: true
    serviceAccount:
      create: true
