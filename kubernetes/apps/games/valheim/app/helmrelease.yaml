---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valheim
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: valheim-k8s
      version: "2.0.1"
      sourceRef:
        kind: HelmRepository
        name: valheim-k8s
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 20m  # Valheim needs time for initial download
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 20m
  values:
    # Server identity
    worldName: "Hancock"
    serverName: "Hancock Valheim"
    
    # Password from SOPS-encrypted secret
    passwordSecret: valheim-secret
    
    # Storage configuration - use NFS PVC
    storage:
      kind: persistentVolumeClaim
      pvc:
        storageClassName: "nfs-client"
        size: "20Gi"
    
    # Server installation storage (downloads/cache)
    serverStorage:
      kind: persistentVolumeClaim
      pvc:
        storageClassName: "nfs-client"
        size: "5Gi"
    
    # Networking - NodePort for home cluster
    networking:
      serviceType: NodePort
      gamePort: 2456
      nodePort: 30456
      publishQueryPort: true
    
    # Container image
    image:
      repository: lloesche/valheim-server
      tag: latest
    
    # Optional: Node selector
    nodeSelector: {}
    tolerations: []
